<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Flujo de arquitectura RGA: prueba local e integración propuesta</title>
<desc id="desc">Diagrama visual con dos flujos: prueba local en Mac con navegador, Open WebUI, Ollama, Gemma, Qwen e índice local; propuesta de integración RGA iOS mediante HTTPS y autenticación con backend RAG, Ollama, documentos e índice vectorial.</desc>
<defs>
  <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#122B40"/><stop offset="1" stop-color="#1B405B"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="145%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#14283A" flood-opacity=".12"/></filter>
  <marker id="arrowNavy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#1B2C3C"/></marker>
  <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#EF7517"/></marker>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#102A43}
    .panelTitle{font-size:25px;font-weight:800;letter-spacing:.5px;fill:#fff}
    .h{font-size:18px;font-weight:750}
    .label{font-size:14px;font-weight:650;fill:#304A60}
    .small{font-size:12px;fill:#536B80}
    .tiny{font-size:11px;fill:#5E7488}
    .edge{stroke:#1B2C3C;stroke-width:4;fill:none;marker-end:url(#arrowNavy)}
    .future{stroke:#EF7517;stroke-width:4;fill:none;stroke-dasharray:11 9;marker-end:url(#arrowOrange)}
  </style>
</defs>

