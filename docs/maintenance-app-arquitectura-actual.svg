  <marker id="arrSlate" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#536D82"/></marker>
  <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#328259"/></marker>
  <marker id="arrGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#C98518"/></marker>
