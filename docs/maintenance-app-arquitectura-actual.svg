<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura de software actual de Maintenance App</title>
<desc id="desc">Vista de arquitectura DEV y QA: usuarios en iPad con aplicación SwiftUI y persistencia local, comunicación HTTP por red LAN con FastAPI en una Mac, autenticación y permisos en backend, PostgreSQL y almacenamiento persistente de archivos.</desc>
