services:
  postgres:
    image: postgres:16-alpine
    container_name: maintenance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maintenance_app}
      POSTGRES_USER: ${POSTGRES_USER:-maintenance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maintenance_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - maintenance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maintenance_user} -d ${POSTGRES_DB:-maintenance_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: maintenance_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      REPOSITORY_BACKEND: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      ATTACHMENT_STORAGE_PATH: /app/storage/attachments
      REPORT_STORAGE_PATH: /app/storage/reports
      REPORT_LOGO_PATH: /app/docs/OldVersionApp/Formats/img/Hitachi-Logo.png
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Persistent host storage for evidence and generated PDF artifacts.
      - ./backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  maintenance_postgres_data:
